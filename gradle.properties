org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Pure-Kotlin project, no NDK/native code — safe to bypass AGP's non-ASCII
# path check. Without this, Windows usernames with accents (e.g. "João")
# make the Gradle sync fail outright (StopExecutionException).
android.overridePathCheck=true
